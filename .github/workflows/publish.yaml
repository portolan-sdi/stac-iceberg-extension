name: Publish Schema

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every released version is tracked under json-schema/vX.Y.Z/, so the site
      # is built from the repository alone. An earlier revision re-downloaded
      # the live site to keep old versions, which made a published URL depend on
      # what the site already served.
      - name: Build site from the tracked schemas
        run: |
          set -euo pipefail
          mkdir -p _site
          versions=()
          for dir in json-schema/v*/; do
            version="$(basename "$dir")"
            test -f "${dir}schema.json"
            mkdir -p "_site/${version}"
            cp "${dir}schema.json" "_site/${version}/schema.json"
            versions+=("$version")
          done
          printf '%s\n' "${versions[@]}" | jq -R . | jq -s 'sort' > _site/versions.json
          cat _site/versions.json

      - name: Check the released tag has a tracked schema
        env:
          TAG: ${{ github.ref_name }}
        run: test -f "_site/${TAG}/schema.json"

      - name: Create the index page
        run: |
          cat > _site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>STAC Iceberg Extension</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
              h1 { color: #333; }
              ul { list-style: none; padding: 0; }
              li { margin: 0.5rem 0; }
              a { color: #0066cc; }
            </style>
          </head>
          <body>
            <h1>STAC Iceberg Extension</h1>
            <p>JSON Schema for the <a href="https://github.com/portolan-sdi/stac-iceberg-extension">STAC Iceberg Extension</a>.</p>
            <h2>Available Versions</h2>
            <ul id="versions"></ul>
            <script>
              fetch('versions.json')
                .then(r => r.json())
                .then(versions => {
                  const ul = document.getElementById('versions');
                  versions.sort().reverse().forEach(v => {
                    const li = document.createElement('li');
                    li.innerHTML = `<a href="${v}/schema.json">${v}</a>`;
                    ul.appendChild(li);
                  });
                });
            </script>
          </body>
          </html>
          HTMLEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
